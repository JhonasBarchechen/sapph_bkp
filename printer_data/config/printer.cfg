# SP5 - Canbus toolhead
# 06/05/2024
# Version: v1.0
# MKS Skipr + THR36

[include mainsail.cfg]
[include THR36.cfg]
[include macros.cfg]
#[include klicky-probe.cfg]
[include eddy_s.cfg]

[exclude_object]
[pause_resume]
[display_status]
[respond]
[gcode_arcs]
resolution: 0.1

[virtual_sdcard]
path: /home/jhonas/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[mcu]
canbus_uuid: 4071532633f0

[mcu THR36]
canbus_uuid: e09eaa4e919e

[temperature_sensor SKIPR] 
sensor_type: temperature_mcu
min_temp: -40
max_temp: 85

[temperature_sensor THR36] 
sensor_type: temperature_mcu
sensor_mcu: THR36
min_temp: -40
max_temp: 85

#[duplicate_pin_override]
#pins: ADC_TEMPERATURE

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 10000
max_z_velocity: 20
max_z_accel: 300

[autotune_tmc stepper_x]
motor: usongshine-17hs4401S
tuning_goal: auto
extra_hysteresis: 2
[autotune_tmc stepper_y]
motor: usongshine-17hs4401S
tuning_goal: auto
extra_hysteresis: 2

[autotune_tmc stepper_z]
motor: usongshine-17hs4401S
tuning_goal: auto
extra_hysteresis: 2
[autotune_tmc stepper_z1]
motor: usongshine-17hs4401S
tuning_goal: auto
extra_hysteresis: 2

[autotune_tmc extruder]
motor: fysetc-g36hsy4407-6d-1200a
tuning_goal: auto
extra_hysteresis: 2



#####################################################################
#   X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin:PC14
dir_pin:PC13
enable_pin:!PC15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: THR36:gpio24
position_min: 0  
position_endstop: 0
position_max: 310
homing_speed:50
homing_retract_dist:5
homing_positive_dir:false
step_pulse_duration:0.000008

[tmc2209 stepper_x]
uart_pin: PE6
run_current: 0.962
interpolate: true
stealthchop_threshold: 0

[stepper_y]
step_pin:PE5
dir_pin:PE4
enable_pin:!PD14
microsteps:16
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:!PA15
position_min: 6
position_endstop:310
position_max:310
homing_speed:50
homing_retract_dist:5
homing_positive_dir:true
step_pulse_duration:0.000008

[tmc2209 stepper_y]
uart_pin: PE3
run_current: 0.962
interpolate: true
stealthchop_threshold: 0


#####################################################################
#   Z Stepper Settings
#####################################################################


[stepper_z]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB6
microsteps: 16
rotation_distance: 8
full_steps_per_rotation:200
endstop_pin: probe:z_virtual_endstop
position_min: -10
position_max: 340
homing_speed: 8
second_homing_speed: 4
homing_retract_dist: 5

[tmc2209 stepper_z]
uart_pin:PB3
run_current:0.8
stealthchop_threshold: 0
interpolate: true


[stepper_z1]
step_pin:PE1
dir_pin:PE0
enable_pin: !PE2
microsteps: 16
rotation_distance: 8
full_steps_per_rotation:200


[tmc2209 stepper_z1]
uart_pin: PB7
run_current:0.8
stealthchop_threshold: 0
interpolate: true





