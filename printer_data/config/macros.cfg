######################### PRINT START / END #########################

[gcode_macro PRINT_START]
variable_bedtemp: 0
variable_hotendtemp: 0
#variable_chambertemp: 0
gcode:      
    # --- Parâmetros ---
    {% set bed = params.BED|default(60)|int %}
    {% set hotend = params.HOTEND|default(200)|int %}
    #{% set chamber = params.CHAMBER|default(0)|int %}

    # Salva variáveis para uso posterior (ex: PRINT_END)
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=bedtemp VALUE={bed}   
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=hotendtemp VALUE={hotend} 
    #SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=chambertemp VALUE={chamber}   
    
    CLEAR_PAUSE                                                                 ; limpa estado de pausa
    UPDATE_DELAYED_GCODE ID=DELAYED_OFF DURATION=0                              ; cancela timer de desligamento
    BED_MESH_CLEAR
    #SET_PIN PIN=caselight VALUE=1                                              ; liga iluminação

    # --- Pré-aquecimento Inicial ---
    M140 S{bed}                                                                 ; inicia aquecimento da mesa
    M104 S150                                                                   ; pré-aquece bico a 150C
    #M141 S{chamber}

    G90                                                                         ; coordenadas absolutas
    G28                                                                         ; home inicial dos eixos
    
    # Aguarda atingir as temperaturas de referência
    M190 S{bed}                                                                 ; aguarda temperatura da mesa (estabiliza o Eddy)
    M109 S150                                                                   ; aguarda bico estabilizar em 150C

    # --- Nivelamento Físico do Pórtico ---
    Z_TILT_ADJUST                                                               ; alinhamento dos motores Z via indução Eddy (sem contato)

    # =========================================================================
    # --- LIMPEZA DE BICO ESTILO K1 (Pré-Tap) ---
    # Aquece a 220C, desce rente à chapa, arrasta lento e resfria de volta a 150C
    # =========================================================================
    NOZZLE_CLEAR HOT_MIN_TEMP=150 HOT_MAX_TEMP=220 BED_MAX_TEMP={bed}

    # --- Calibração Z via Nozzle Tap (BTT Eddy Tap) ---
    # Move para o centro da mesa para o Tap
    G0 Z10 F3000                                                                ; elevação de segurança
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} F19500  ; centro da mesa
    
    # Executa o Tap com o bico 100% limpo e a 150C
    PROBE METHOD=tap samples=3
    
    # Mapeamento rápido da malha adaptativa com sensor Eddy
    BED_MESH_CALIBRATE METHOD=rapid_scan 
    SET_GCODE_OFFSET Z_ADJUST=0.12 MOVE=1

    # --- Preparação para Impressão ---
    G0 Z10 F3000                                                                ; elevação de segurança
    G0 X5 Y8 F19500                                                             ; move para o início da purga (canto frontal esquerdo)
    
    # Aquece até a temperatura real de impressão
    M109 S{hotend}                                                              ; aguarda temperatura final de extrusão
    
    # --- Linha de Purga ---
    G92 E0                                                                      ; zera extrusor
    G1 X5 Y8 Z0.3 F19500.0                                                      ; desce para altura da primeira camada
    G1 X5 Y60 Z0.3 F1500.0 E10                                                  ; extruda primeira linha de purga
    G92 E0                                                                      ; zera extrusor
    G1 Z2.0 F3000                                                               ; levanta Z antes de iniciar a peça
    
    #SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                         ; ativa sensor de filamento

[gcode_macro PRINT_END]
gcode:
	#SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                                 ; disable filament sensor
    CLEAR_PAUSE                                                                          ; clear pause                                              
    M400                                                                                 ; wait for buffer to clear
    G92 E0                                                                               ; zero the extruder
    M104 S0                                                                              ; turn only the hotend off
    M140 S{printer["gcode_macro PRINT_START"].bedtemp|int}                               ; return the bed to temp, slicers like to turn it off
    M107                                                                                 ; turn off part cooling fan
    G91                                                                                  ; relative positioning
    G1 Z10 F3000                                                                          ; move nozzle up 5mm
    G90                                                                                  ; absolute positioning
    G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y - 10} F19500.0    ; park nozzle at rear 
	SET_GCODE_OFFSET Z=0
    UPDATE_DELAYED_GCODE ID=DELAYED_OFF DURATION=300                                     ; turn everything off in 5 min              ; beep 3 times

[delayed_gcode DELAYED_OFF]
gcode:
    OFF ; call "OFF" macro, to turn off everything (heaters, motors, lights, fans)


[gcode_macro OFF]
gcode:
    M84                                   ; turn steppers off
    TURN_OFF_HEATERS                      ; turn bed / hotend off
    M107                                  ; turn print cooling fan off
    #SET_PIN PIN=caselight VALUE=0        ; turn light off
    
		
######################### PAUSE/RESUME/CANCEL #########################

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    CLEAR_PAUSE
    #SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT

# Pause and park toolhead at front center. Z hop by 10mm.
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}                                                  ; z hop amount
    
    {% if printer['pause_resume'].is_paused|int == 0 %}     
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                             ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}   ; set hotend temp variable for reference in resume macro
                                
        #SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                                 ; disable filament sensor       
        SAVE_GCODE_STATE NAME=PAUSE                                                         ; save current print position for resume                
        BASE_PAUSE                                                                          ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}      ; check that zhop doesn't exceed z max
            G91                                                                             ; relative positioning
            G1 Z{z} F900                                                                    ; raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                 ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                 ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F19500 ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                     ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error) 
        M104 S0                                                                             ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                      ; set timeout to 12 hours
    {% endif %}

# Return Z hop back down, prime nozzle, resume print.
[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}
    
    {% if printer['pause_resume'].is_paused|int == 1 %}
        #SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                                                              ; enable filament sensor
        #RESETRGB                                                                                                         ; reset LCD color
        #SET_LOGO_LEDS_BY_NAME COLOR="WHITE"                                                                              ; set logo LEDs back to white
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}                                      ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                                                            ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                                                         ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)  
        G91                                                                                                              ; relative positioning
        M83                                                                                                              ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}                                             
            G1 Z{zhop * -1} E{e} F900                                                                                    ; prime nozzle by E, lower Z back down
        {% else %}                      
            G1 Z{zhop * -1} F900                                                                                         ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}                             
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=100                                                             ; restore position
        BASE_RESUME                                                                                                      ; resume print
    {% endif %}

# Filament runout / change alias    
[gcode_macro M600]
gcode:
    PAUSE



    
	
######################### MISC #########################

# Replace M109 (Wait for Hotend Temperature) with TEMPERATURE_WAIT so we don't have to wait for PID to level off.
[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}

    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-2} MAXIMUM={s+2}   ; Wait for hotend temp (within 4 degree)
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-1} MAXIMUM={s+2}  ; Wait for bed temp (within 3 degree)
    {% endif %}

      
######################### FILAMENT #########################

[gcode_macro UNLOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=UNLOADFILAMENT
    M83                                   ; set extruder to relative
    G1 E10 F600                           ; extrude a little to soften tip 
    G1 E-120 F1800                        ; retract filament completely
    RESTORE_GCODE_STATE NAME=UNLOADFILAMENT

[gcode_macro LOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=LOADFILAMENT
    M83 ; set extruder to relative
    G1 E120 F600
    G1 E60 F300
    RESTORE_GCODE_STATE NAME=LOADFILAMENT
   
[gcode_macro HOT_UNLOAD]
gcode:
    # Parameters
    {% set t = params.T|default(230)|int %}
    
    M104 S{t}
    PARKFRONTLOW
    M109 S{t}
    UNLOAD_FILAMENT
    
[gcode_macro HOT_LOAD]
gcode:
    # Parameters
    {% set t = params.T|default(230)|int %}
    
    M104 S{t}
    PARKFRONTLOW
    M109 S{t}
    LOAD_FILAMENT

######################### CONDITIONALS #########################

# Conditional G28 (home if not already homed)
[gcode_macro _CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    
######################### PARKING #########################

# Park front center
[gcode_macro PARKFRONT]
gcode:
    _CG28
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z{printer.toolhead.axis_maximum.z/2} F19500        
    RESTORE_GCODE_STATE NAME=PARKFRONT
    
# Park front center, but low down
[gcode_macro PARKFRONTLOW]
gcode:
    _CG28
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z20 F19500                                     
    RESTORE_GCODE_STATE NAME=PARKFRONT
    
# Park top rear left
[gcode_macro PARKREAR]
gcode:
    _CG28
    SAVE_GCODE_STATE NAME=PARKREAR
    G90
    G0 X{printer.toolhead.axis_minimum.x+10} Y{printer.toolhead.axis_maximum.y-10} Z{printer.toolhead.axis_maximum.z-50} F19500     
    RESTORE_GCODE_STATE NAME=PARKREAR

# Park center of build volume
[gcode_macro PARKCENTER]
gcode:
    _CG28
    SAVE_GCODE_STATE NAME=PARKCENTER
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z{printer.toolhead.axis_maximum.z/2} F19500    
    RESTORE_GCODE_STATE NAME=PARKCENTER
    
# Park 15mm above center of bed
[gcode_macro PARKBED]
gcode:
    _CG28
    SAVE_GCODE_STATE NAME=PARKBED
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z15 F19500                                     
    RESTORE_GCODE_STATE NAME=PARKBED


#####################################################################
#           LIMPEZA DE BICO PARA BTT EDDY DUO (PRÉ-TAP)             #
#####################################################################

[gcode_macro NOZZLE_CLEAR]
description: Limpeza por arraste e estabilizacao a 150C para o BTT Eddy Tap
# ====== Posições do Arraste (Ajuste para sua mesa) ======
variable_start_x: 1          # X inicial (centro-fundo da mesa)
variable_start_y: 6         # Y traseiro (fora da área das peças)
variable_wipe_len_x: 2       # Extensão do arraste em X
variable_wipe_len_y: 40	        # Deslocamento em Y
variable_wipe_z: 0.1            # Altura rente à chapa PEI (0.05 a 0.1mm)
variable_wipe_speed: 150        # 2.5 mm/s (movimento lento)
variable_travel_speed: 6000     # Velocidade de deslocamento rápido
variable_retract_len: 2.0       # Retração para travar vazamento

# ====== Temperaturas ideais para o BTT Eddy ======
variable_default_hot_max: 220   # Derrete o resíduo velho da ponta
variable_default_hot_min: 150   # TEMPERATURA PADRÃO DO BTT EDDY TAP (~150°C)
variable_default_bed_temp: 60   # Temperatura de trabalho da mesa

gcode:
    {% set hot_max = params.HOT_MAX_TEMP|default(printer["gcode_macro NOZZLE_CLEAR"].default_hot_max)|float %}
    {% set hot_min = params.HOT_MIN_TEMP|default(printer["gcode_macro NOZZLE_CLEAR"].default_hot_min)|float %}
    {% set bed_temp = params.BED_MAX_TEMP|default(params.BED_TEMP|default(printer["gcode_macro NOZZLE_CLEAR"].default_bed_temp))|float %}

    SAVE_GCODE_STATE NAME=NOZZLE_CLEAR_STATE

    # 1. Homing preliminar dos eixos
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Homing preliminar...
        G28
    {% endif %}

    # 2. Posiciona em Z seguro e vai até o fundo da mesa
    G90
    G1 Z5 F3000
    G1 X{start_x} Y{start_y} F{travel_speed}

    # 3. Aquece a mesa e o bico a 220°C para amolecer resíduos
    M117 Amolecendo ponta do bico...
    {% if printer.heater_bed.temperature < bed_temp %}
        M190 S{bed_temp}        # Aguarda a mesa aquecer (importante para estabilidade térmica do Eddy)
    {% endif %}
    M109 S{hot_max}

    # 4. Retração leve para evitar gotejamento
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-{retract_len} F1800
    {% endif %}

    # 5. Encosta o bico na chapa
    G90
    G1 Z{wipe_z} F600

    # 6. Liga ventoinha no máximo e programa resfriamento para os 150°C do Tap
    M104 S{hot_min}
    M106 S255

    # 7. Arraste lento enquanto resfria (o plástico gruda na mesa e sai do bico)
    M117 Arraste e resfriamento para Tap...
    G1 X{start_x + wipe_len_x} Y{start_y + wipe_len_y} F{wipe_speed}

    # 8. Aguarda alcançar os 150°C exatos do Tap
    M109 S{hot_min}

    # 9. Desliga ventoinha e eleva o Z
    M107
    G1 Z5 F3000

    M117 Bico limpo a 150C. Pronto para o Tap!
    RESTORE_GCODE_STATE NAME=NOZZLE_CLEAR_STATE








  
  	