# Part Cooling (Conectado na porta FAN1 da EBB36)
[fan] 
pin: EBBCan:PA0
max_power: 1.0
kick_start_time: 0.5
off_below: 0.10

# Hotend Fan (Conectado na porta FAN2 da EBB36)
[heater_fan hotend_fan]
pin: EBBCan:PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 60.0
fan_speed: 1.0
shutdown_speed: 1.0

#####################################################################
#	ADXL345 (Integrado na BTT EBB36 v1.2)
#####################################################################

[adxl345]
cs_pin: EBBCan:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x, y, z # Verifique a orientação após instalar com ACCELEROMETER_QUERY

[resonance_tester]
accel_chip: adxl345
probe_points:
    150, 150, 50  # an example

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
#    Path where the processed results will be stored. If the folder doesn't exist,
#    it will be automatically created. You can change this if you'd like to store 
#    results in a different location.
# number_of_results_to_keep: 10
# keep_raw_data: False
# show_macros_in_webui: True
# timeout: 600
# measurements_chunk_size: 2
# max_freq: 200
# dpi: 300

[input_shaper]
shaper_freq_x: 84.0
shaper_type_x: ei
shaper_freq_y: 45.0 
shaper_type_y: mzv
damping_ratio_x: 0.058 
damping_ratio_y: 0.048